[package]
name = "mai-ota-example-common"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "What every mai-ota example shares: the CoAP server with EDHOC and OSCORE, and /fw"
publish = false

# Built only as a dependency of the examples, each its own workspace.
[workspace]

[dependencies]
mai-ota = { path = "../..", features = ["coap"] }
mai-coap = { git = "https://github.com/snabb/mai-coap.git", rev = "925b29b741664802a535fb4582e70d58c786be71", default-features = false, features = ["server", "block1", "edhoc", "software-crypto", "embassy-time"] }
chacha20 = { version = "0.10.2", default-features = false, features = ["rng"] }
embassy-time = "0.5"
rand_core = { version = "0.10", default-features = false }

# `thread`: OpenThread under embassy-net, shared by the Thread examples. Each
# example picks OpenThread's radio backend itself.
openthread = { version = "0.4", default-features = false, features = ["slaac", "srp-client"], optional = true }
# The revision mai-coap's xarxa transport takes embassy-net from.
embassy-net = { git = "https://github.com/embassy-rs/embassy.git", rev = "8a940dab0d56a910277b816987e45315ca7979aa", features = ["ipv6", "medium-ip"], optional = true }
embassy-net-driver-channel = { git = "https://github.com/embassy-rs/embassy.git", rev = "8a940dab0d56a910277b816987e45315ca7979aa", optional = true }
embassy-futures = { version = "0.1", optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
heapless = { version = "0.9", optional = true }
static_cell = { version = "2.1", optional = true }
defmt-or-log = { version = "0.2", default-features = false, optional = true }
defmt = { version = "1", optional = true }
log = { version = "0.4", optional = true }

[features]
thread = [
    "dep:openthread",
    "dep:embassy-net",
    "dep:embassy-net-driver-channel",
    "dep:embassy-futures",
    "dep:sha2",
    "dep:heapless",
    "dep:static_cell",
    "dep:defmt-or-log",
]
# The Thread module's logging; one of them with `thread`.
defmt = ["dep:defmt", "defmt-or-log?/defmt", "openthread?/defmt", "embassy-net?/defmt"]
log = ["dep:log", "defmt-or-log?/log", "openthread?/log", "embassy-net?/log"]

# Applies only when this crate is built alone (formatting, CI): embassy-net from
# Git takes these from its own repository, and mai-coap the released ones.
[patch."https://github.com/embassy-rs/embassy.git"]
embassy-futures = { version = "=0.1.2" }
embassy-time = { version = "=0.5.1" }
embassy-time-driver = { version = "=0.2.2" }
