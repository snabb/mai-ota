[package]
name = "xiao-nrf54lm20a"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "mai-ota example for the Seeed XIAO nRF54LM20A: firmware updates over Thread"
publish = false
build = "../nrf54l/build.rs"

[workspace]

[[bin]]
name = "xiao-nrf54lm20a"
path = "../nrf54l/main.rs"
test = false
bench = false

[dependencies]
mai-ota = { path = "../..", features = ["coap", "embassy-boot", "nrf54lm20", "defmt"] }
mai-ota-example-common = { path = "../common", features = ["thread", "defmt"] }
mai-coap = { git = "https://github.com/snabb/mai-coap.git", rev = "925b29b741664802a535fb4582e70d58c786be71", default-features = false, features = ["embassy-net-xarxa-ipv6", "defmt"] }

# The revision is set by the patch below.
embassy-nrf = { version = "0.11", features = [
    "nrf54lm20-app-s",
    # MPSL owns GRTC channels 7 to 11 and nrf-802154 3 to 5; 1 is free.
    "time-driver-grtc-cc1",
    "time",
    "unstable-pac",
    "defmt",
] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt"] }
embassy-sync = "0.8"
embassy-futures = "0.1"
# The revision mai-coap's xarxa transport takes embassy-net from.
embassy-net = { git = "https://github.com/embassy-rs/embassy.git", rev = "8a940dab0d56a910277b816987e45315ca7979aa", features = [
    "ipv6",
    "medium-ip",
    "iface-bind",
    # No `icmp-ping-reply`: OpenThread answers ping itself, so the stack's reply
    # would be a duplicate.
    "defmt",
] }
# Built from source: no prebuilt archive for this target. `slaac` forms the address
# from a border router's prefix, the only one reachable from outside the mesh;
# `srp-client` registers the name a client finds it by; `isupper` supplies a C
# function OpenThread calls.
openthread = { version = "0.4", default-features = false, features = ["slaac", "srp-client", "isupper", "defmt"] }
# Nordic's 802.15.4 driver, and the multiprotocol layer it runs under, which also
# arbitrates the RRAM and supplies the critical section.
nrf-802154 = { version = "0.1", default-features = false, features = ["nrf54lm20-app-s", "openthread", "defmt"] }
nrf-mpsl = { version = "0.4", default-features = false, features = ["critical-section-impl", "defmt"] }
# The C library functions OpenThread's sources call.
tinyrlibc = { version = "0.5", default-features = false, features = ["strtoul", "utoa", "strcmp", "strstr"] }
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt = "1"
# Not blocking: with no probe attached, a full buffer must not stop the firmware.
defmt-rtt = { version = "1", features = ["disable-blocking-mode"] }
panic-probe = { version = "1", features = ["print-defmt"] }
rand_core = { version = "0.10", default-features = false }
static_cell = "2.1"

# Git rather than the released 0.11.0: the nRF54L needs fixes since (the CRACEN
# generator, GRTC channel 11 for MPSL). The family together, so the graph has one
# `embassy-time`; the revision mai-coap and mai-ota are tested with.
[patch.crates-io]
embassy-nrf = { git = "https://github.com/embassy-rs/embassy.git", rev = "8a940dab0d56a910277b816987e45315ca7979aa" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "8a940dab0d56a910277b816987e45315ca7979aa" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "8a940dab0d56a910277b816987e45315ca7979aa" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", rev = "8a940dab0d56a910277b816987e45315ca7979aa" }

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
